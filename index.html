<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OSAMA HUB" />
    <meta name="description" content="OSAMA HUB — private personal operating system" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>OSAMA HUB</title>
    <script src="boot.js"></script>
    <style>
      html { background: #f4f2ec; }
      html.dark { background: #0e0e10; }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; }
      #splash svg { width: 72px; height: 72px; animation: splash 1.4s ease-in-out infinite; }
      @keyframes splash { 50% { transform: scale(0.92); opacity: 0.7; } }
      @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" aria-hidden="true">
        <svg viewBox="0 0 512 512"><rect width="512" height="512" rx="128" fill="#C8FF2E" /><circle cx="256" cy="256" r="124" fill="none" stroke="#111114" stroke-width="56" /><circle cx="256" cy="256" r="34" fill="#111114" /></svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
